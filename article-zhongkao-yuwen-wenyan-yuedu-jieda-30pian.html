<h1 class="h1">中考语文文言文阅读解答30篇</h1>
<h2>一、文言文阅读步骤</h2>
<p><strong>第一步：</strong>粗读全文，了解大意</p>
<p><strong>第二步：</strong>精读句子，对译重点字词</p>
<p><strong>第三步：</strong>回读全篇，理解主旨</p>

<h2>二、实词推断方法</h2>
<p>语境推断法——联系上下文</p>
<p>词性分析法——根据位置判断</p>
<p>成语对照法——保留至今的成语对照</p>
<p>迁移法——用已学知识推断</p>

<h2>三、翻译技巧</h2>
<p>留——人名/地名/官职名保留</p>
<p>换——古今异义词换成今义</p>
<p>增——省略成分补充</p>
<p>删——无义助词删除</p>
<p>调——倒装句调整顺序</p>

<h2>四、常见考题</h2>
<p>断句题：找动词主语，辅助虚词</p>
<p>翻译题：关键词+通假+活用+句式</p>
<p>内容理解：叙事+人物+主题</p>
