<h1 class="h1">中考语文专题面析解答20篇</h1>
<h2>专题一面析：字音字形</h2>
<p><strong>易错字音：</strong>发酵(jiào)｜友谊(yì)｜比较(jiào)｜机械(xiè)</p>

<h2>专题二面析：词语成语</h2>
<p><strong>易错成语：</strong>再接再厉(励)｜名列前茅(矛)｜走投无路(头)</p>

<h2>专题三面析：病句修改</h2>
<p><strong>典型病句：</strong>通过这次活动，使我受到教育。（缺主语）</p>

<h2>专题四面析：古诗词鉴赏</h2>
<p><strong>意象分析：</strong>月——思乡/团圆</p>
<p><strong>情感判断：</strong>送别/思乡/爱国/隐逸</p>

<h2>专题五面析：文言文</h2>
<p><strong>实词释义：</strong>穷（走投无路）、汤（热水）、走（跑）</p>

<h2>专题六面析：现代文阅读</h2>
<p><strong>公式应用：</strong>人物形象=性格+事件+情感</p>
