<h2>一、体型完全解答手册</h2>

<h2>记叙文体</h2>
<p>标题含义/六要素/人物形象/环境描写/修辞赏析/段落作用/主题概括</p>

<h2>说明文体</h2>

<h2>议论文体</h2>

<h2>二、公式汇总</h2>
<div class="moban">

人物形象 = 性格+事件+情感<br>
环境描写 = 气氛+心情+情节+主题<br>
修辞赏析 = 修辞+对象+效果+情感
</div>
