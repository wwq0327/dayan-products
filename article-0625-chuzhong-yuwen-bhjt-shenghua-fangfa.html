<h2>一、句型转换技巧</h2>

<h3>① 陈述句改为感叹句</h3>
<div class="formula">方法：加"多么""真""太"等词 + 感叹号</div>
<div class="step-box">
  <p>原句：妈妈很辛苦。</p>
  <p>改写：妈妈多么辛苦啊！</p>
</div>

<h3>② 双重否定句</h3>
<div class="formula">方法：用"不得不""没有不""无不"替换原句</div>
<div class="step-box">
  <p>原句：大家都喜欢他。</p>
  <p>改写：大家无不喜欢他。</p>
</div>
