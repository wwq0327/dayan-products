<h1 class="h1">中考语文病句总结提高30篇</h1>
<h2>一、病句六大类型总结</h2>
<p><strong>1. 语序不当：</strong>多项定语/状语顺序颠倒</p>
<p><strong>2. 搭配不当：</strong>主谓/动宾/关联词不搭配</p>
<p><strong>3. 成分残缺：</strong>缺主语/谓语/宾语</p>
<p><strong>4. 成分赘余：</strong>语义重复</p>
<p><strong>5. 结构混乱：</strong>两个句子混杂</p>
<p><strong>6. 不合逻辑：</strong>前后矛盾/一面两面对应</p>

<h2>二、辨析技巧总结</h2>
<p>技巧1：压缩主干——检查主谓宾</p>
<p>技巧2：搭配检验——主谓/动宾</p>
<p>技巧3：语序检查——定状语位置</p>
<p>技巧4：逻辑检验——是否矛盾</p>

<h2>三、修改方法总结</h2>
<p>删除法——去多余成分</p>
<p>替换法——改不搭配</p>
<p>添加法——补残缺</p>
<p>调整法——改语序</p>
