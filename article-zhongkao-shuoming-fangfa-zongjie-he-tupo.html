<h1 class="h1">中考语文说明方法总结与突破技巧</h1>
<h2>说明方法一览表</h2>
<p><strong>举例子：</strong>通过具体实例说明事物特征</p>
<p><strong>列数字：</strong>用具体数据说明，科学准确</p>
<p><strong>作比较：</strong>对比两个事物，突出特征</p>
<p><strong>打比方：</strong>用比喻说明，生动形象</p>
<p><strong>下定义：</strong>用"……是……"揭示本质</p>
<p><strong>分类别：</strong>分门别类说明，条理清晰</p>
<p><strong>作诠释：</strong>解释说明，不是完整定义</p>
<p><strong>摹状貌：</strong>描写事物形状色彩</p>

<h2>答题公式</h2>
<div class="moban">"这句话运用了……说明方法，具体准确地说明了……（对象特征），使说明……（效果）。"</div>

<h2>易混辨析</h2>
<p>下定义 vs 作诠释：下定义是完整定义（"是"字连接），作诠释只是部分解释。</p>
