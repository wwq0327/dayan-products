<h2>一，病句提高完全技巧手册</h2>
<h2>提高技巧</h2>
<p>1. 语序不当——多层定语/状语顺序</p>
<p>2. 搭配不当——主谓/动宾/关联词搭配</p>
<p>3. 成份残缺——主语/谓语/宾语残缺</p>
<p>4. 成份赘余——重复/多余成分</p>
<p>5. 结构混乱——句式杂糅</p>
<p>6. 表意不明——指代不明/歧义</p>
<p>7. 不合逻辑——自相矛盾/分类不当</p>
<p>8. 标点不当——引号/顿号/分号使用</p>
