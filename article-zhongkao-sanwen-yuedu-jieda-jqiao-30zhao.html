<h1 class="h1">中考语文散文阅读解答技巧30招</h1>
<h2>一、散文分类</h2>
<p><strong>叙事散文：</strong>以记叙为主，借事说理</p>
<p><strong>写景散文：</strong>借景抒情，意境优美</p>
<p><strong>抒情散文：</strong>直抒胸臆，情感浓烈</p>
<p><strong>哲理散文：</strong>借事说理，感悟人生</p>

<h2>二、答题技巧</h2>
<p><strong>第1招：</strong>抓住标题含义（表层+深层）</p>
<p><strong>第2招：</strong>抓住线索（人/事/物/情/时/地）</p>
<p><strong>第3招：</strong>抓住线索贯穿全文</p>
<p><strong>第4招：</strong>抓住语言特点（优美/朴实/含蓄）</p>
<p><strong>第5招：</strong>抓住托物言志（物+志的对应）</p>

<h2>三、满分公式</h2>
<div class="moban">
标题含义 = 表层……+深层……<br>
线索作用 = 贯穿全文+连接内容<br>
语言赏析 = 词语+修辞+情感<br>
主题概括 = 通过……+表达了……
</div>
