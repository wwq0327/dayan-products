<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品详情 — 大衍语文店</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div style="background:#1a1a2e;color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;font-size:.85em">
    <a href="index.html" style="color:#a8d8ff;text-decoration:none;font-weight:700">🔮 大衍语文店</a>
    <div style="display:flex;gap:14px">
      <a href="index.html" style="color:#a8d8ff;text-decoration:none">🏠 首页</a>
      <a href="articles.html" style="color:#a8d8ff;text-decoration:none">📚 文章</a>
      <a href="sitemap.html" style="color:#a8d8ff;text-decoration:none">🗺️ 导览</a>
    </div>
  </div>
  <header class="detail-header">
    <div class="container">
      <button class="back-link" onclick="historyBack()">
        <span class="back-arrow">←</span> 返回列表
      </button>

      <div class="detail-meta" id="metaArea"></div>

      <h1 class="detail-title" id="titleArea"></h1>
      <div class="detail-price-badge" id="priceBadge"></div>
    </div>
  </header>

  <div class="detail-body" id="detailBody"></div>

  <footer class="footer">
    <p>Powered by <strong>大衍神君 AI Agent</strong> · 王老师团队</p>
    <p style="margin-top:8px"><a href="https://wwq0327.github.io/dayan-products/">https://wwq0327.github.io/dayan-products/</a></p>
  </footer>

  <script src="js/data.js"></script>
  <script>
    (function() {
      function getParam(name) {
        const p = new URLSearchParams(window.location.search);
        return p.get(name);
      }

      const id = getParam('id');
      const material = DATA.getById(id);

      if (!material) {
        document.getElementById('metaArea').innerHTML = '';
        document.getElementById('titleArea').textContent = '产品未找到';
        document.getElementById('detailBody').innerHTML =
          '<div class="detail-error"><h2>产品未找到</h2><p>请确认链接是否正确，或返回列表重新选择。</p></div>';
        return;
      }

      /* ── Breadcrumb / Meta ── */
      const catName = DATA.getCategoryName(material.category);
      document.getElementById('metaArea').innerHTML =
        '<span class="detail-category">' + catName + '</span>' +
        '<span class="detail-date">' + material.date + '</span>' +
        '<div class="detail-tags">' +
          material.tags.map(t => '<span class="detail-tag">' + t + '</span>').join('') +
        '</div>';

      document.getElementById('titleArea').textContent = material.title;
      document.getElementById('priceBadge').textContent = material.price + ' · 购买';

      /* ── Hero image ── */
      const imgMap = {
        '病句修改': 'bingju-01-preview.png','拼音专项复习清单': 'ziyin-13-preview.png',
        '虚词辨析': 'xuci-03-preview.png','虚词复习专题': 'xuci-03-preview.png',
        '古诗词答题': 'gushici-04-preview.png','古诗词分类整理': 'gushici-04-preview.png',
        '名著必背': 'mingzhu-05-preview.png','散文阅读': 'shuomingshi-06-preview.png',
        '说明文阅读': 'shuomingshi-06-preview.png','议论文阅读': 'yilunwen-07-preview.png',
        '万能写作模板': 'jixuwen-08-preview.png','万能答题模板': 'jixuwen-08-preview.png',
        '43天语文': '43tian-09-preview.png','六年对比报告': '6nian-10-preview.png',
        '学习资料库': 'xuexiziliao-11-preview.png','成语运用': 'chengyu-12-preview.png',
        '字音字形': 'ziyin-13-preview.png',
        '水墨中国风手机壁纸套装': 'wallpaper-ink-sunrise.jpg',
        '卡通励志手机壁纸套装': 'wallpaper-cartoon-tiandao.jpg'
      };
      let heroImg = '';
      const galleryMap = {
        '水墨中国风手机壁纸套装': [
          'wallpaper-ink-sunrise.jpg',
          'wallpaper-ink-xiushen-1.jpg','wallpaper-ink-xiushen-2.jpg','wallpaper-ink-xiushen-3.jpg',
          'wallpaper-ink-damo-1.jpg','wallpaper-ink-damo-2.jpg',
          'wallpaper-ink-mingyue-1.jpg','wallpaper-ink-mingyue-2.jpg',
          'wallpaper-ink-taohuayuan-1.jpg','wallpaper-ink-taohuayuan-2.jpg',
          'wallpaper-ink-meihua-1.jpg','wallpaper-ink-meihua-2.jpg',
          'wallpaper-ink-jiangnan-1.jpg','wallpaper-ink-jiangnan-2.jpg',
          'wallpaper-ink-yuzhou-1.jpg','wallpaper-ink-yuzhou-2.jpg',
          'wallpaper-ink-pubu-1.jpg','wallpaper-ink-pubu-2.jpg',
          'wallpaper-ink-hetang-1.jpg','wallpaper-ink-hetang-2.jpg'
        ],
        '卡通励志手机壁纸套装': [
          'wallpaper-cartoon-tiandao.jpg',
          'wallpaper-cartoon-student-1.jpg','wallpaper-cartoon-student-2.jpg',
          'wallpaper-cartoon-motiv-1.jpg','wallpaper-cartoon-motiv-2.jpg',
          'wallpaper-cartoon-fenbi-1.jpg','wallpaper-cartoon-fenbi-2.jpg',
          'wallpaper-cartoon-bisheng-1.jpg','wallpaper-cartoon-bisheng-2.jpg',
          'wallpaper-cartoon-owl-1.jpg','wallpaper-cartoon-owl-2.jpg',
          'wallpaper-cartoon-caodi-1.jpg','wallpaper-cartoon-caodi-2.jpg'
        ]
      };
      for (const [kw, imgs] of Object.entries(galleryMap)) {
        if (material.title.includes(kw)) {
          heroImg = '<div class="detail-gallery">';
          imgs.forEach(img => { heroImg += '<div class="gallery-thumb"><img src="_previews/' + img + '" alt="preview" /></div>'; });
          heroImg += '</div>';
          break;
        }
      }
      if (!heroImg) {
        for (const [kw2, img2] of Object.entries(imgMap)) {
          if (material.title.includes(kw2)) {
            heroImg = '<div class="detail-hero-img"><img src="_previews/' + img2 + '" alt="' + material.title + '" /></div>';
            break;
          }
        }
      }

      /* ── Content ── */
      const adj = DATA.getAdjacent(id);
      let contentHtml = heroImg + '<div class="detail-content">' + material.content + '</div>';

      /* ── Purchase CTA ── */
      contentHtml += `
        <div style="background:#fef9f8;border:1px solid #f5d8d3;border-radius:12px;padding:24px;margin-top:32px;text-align:center">
          <h3 style="font-size:18px;font-weight:600;margin-bottom:8px">如何购买此产品</h3>
          <div style="display:flex;justify-content:center;gap:12px;margin-bottom:16px;font-size:12px;color:#888">
            <span>✅ 王老师出品</span>
            <span>📅 南充中考专用</span>
            <span>⚡ 邮件自动发货</span>
          </div>
          <p style="color:#666;font-size:14px;margin-bottom:16px">发送邮件至 <strong style="color:#c0392b;font-size:16px">sjfc_0224@qq.com</strong></p>
          <p style="color:#888;font-size:13px">标题写产品名称，如"${material.title.split('（')[0]}"，自动发货</p>
          <div style="margin-top:16px">
            <a href="mailto:sjfc_0224@qq.com?subject=${encodeURIComponent(material.title.split('（')[0])}" style="display:inline-flex;align-items:center;gap:8px;background:#c0392b;color:#fff;font-size:16px;font-weight:600;padding:12px 28px;border-radius:8px;text-decoration:none">
              📧 立即购买
            </a>
          </div>
        </div>`;

      /* ── Nav ── */
      contentHtml += '<div class="detail-nav">';
      if (adj.prev) {
        contentHtml +=
          '<button class="nav-btn" onclick="window.location.href=\'detail.html?id=' + adj.prev.id + '\'">' +
            '<div><div class="nav-btn-label">← 上一篇</div><div class="nav-btn-title">' + adj.prev.title + '</div></div>' +
          '</button>';
      } else {
        contentHtml += '<div></div>';
      }
      if (adj.next) {
        contentHtml +=
          '<button class="nav-btn nav-btn-next" onclick="window.location.href=\'detail.html?id=' + adj.next.id + '\'">' +
            '<div><div class="nav-btn-label">下一篇 →</div><div class="nav-btn-title">' + adj.next.title + '</div></div>' +
          '</button>';
      }
      contentHtml += '</div>';

      document.getElementById('detailBody').innerHTML = contentHtml;

      /* ── Dynamic title ── */
      document.title = material.title + ' — 大衍语文店';

    })();

    function historyBack() {
      if (document.referrer && document.referrer.indexOf(window.location.host) === 0) {
        history.back();
      } else {
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
