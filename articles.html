/* Pagination */

.footer{text-align:center;padding:28px;color:#bbb;font-size:0.8em;border-top:1px solid #eee;margin-top:20px}
.footer a{color:#c0392b;text-decoration:none}

/* Mobile */
@media(max-width:768px){
  .layout{flex-direction:column;padding:12px}

  .sidebar-title{display:none}
  .sidebar-cat{display:inline-block;font-size:.8em;padding:5px 12px;border:1.5px solid #e0e0e0;border-radius:50px;background:#fff}
  .sidebar-cat.active{background:#c0392b;color:#fff;border-color:#c0392b}
  .article-grid{grid-template-columns:1fr}
}

<script src="js/data.js"></script>
<script>
(function() {
  // ── Category mapping ──
  // Maps our subject categories to keyword patterns in titles/summaries/tags
  const CAT_KEYWORDS = {
    '综合备考': ['中考','备考','复习计划','冲刺','考场','考前','应试','真题','南充','一模','二模','三模','诊断','估分','全攻略','30天','全年','万能攻略','复习','一模','二轮','三轮','模拟','适应性'],
    '基础知识': ['拼音','字音','字形','字义','同义词','反义词','多音字','易错字'],
    '病句修改': ['病句','语病','搭配不当','语序不当','句式杂糅','成分残缺','成分赘余','表意不明','不合逻辑'],
    '成语标点': ['成语','标点','标点符号','引号','冒号','分号','破折号','省略号'],
    '文言文': ['文言','虚词','实词','词类活用','古今异义','特殊句式','宾语前置','状语后置','定语后置','被动句','判断句','省略句','断句','翻译','文言文阅读'],
    '古诗词': ['古诗','古诗词','诗词鉴赏','诗歌','默写','名句','意象','情感','主题','手法','修辞','诗句','诗词','古体诗','近体诗'],
    '现代文': ['现代文','散文','说明文','议论文','小说','记叙文','阅读','答题技巧','答题公式','文章分析','段落作用','句子赏析','词语理解','内容概括','中心思想'],
    '作文': ['作文','写作','开头','结尾','素材','立意','结构','层次','议论文','记叙文','真情','语言','细节','描写','命题','半命题','话题'],
    '名著导读': ['名著','导读','西游记','红楼梦','水浒传','骆驼祥子','海底两万里','昆虫记','朝花夕拾','呐喊','红岩','艾青诗选']
  };

  const PAGE_SIZE_DEFAULT = 30;
  let activeCat = 'all';
  let searchQuery = '';
  let sortOrder = 'default';
  let currentPage = 1;

  // All articles (id starts with 'a')
  const ALL = DATA.materials.filter(m => m.id.startsWith('a'));

  // ── Categorize each article ──
  function getSubjectCat(article) {
    const text = (article.title + ' ' + (article.summary || '') + ' ' + ((article.tags||[]).join(' '))).toLowerCase();
    for (const [cat, kws] of Object.entries(CAT_KEYWORDS)) {
      for (const kw of kws) {
        if (text.includes(kw.toLowerCase())) return cat;
      }
    }
    return null;
  }

  // ── Build count per subject ──
  const catCounts = { all: ALL.length };
  for (const cat of Object.keys(CAT_KEYWORDS)) catCounts[cat] = 0;
  ALL.forEach(a => {
    const cat = getSubjectCat(a);
    if (cat && catCounts[cat] !== undefined) catCounts[cat]++;
  });

  // Update sidebar counts
  for (const cat of Object.keys(catCounts)) {
    const el = document.getElementById('cnt-' + cat);
    if (el) el.textContent = catCounts[cat];
  }

  function getFiltered() {
    let items = ALL;
    if (activeCat !== 'all') {
      items = items.filter(a => getSubjectCat(a) === activeCat);
    }
    const q = searchQuery.trim().toLowerCase();
    if (q) {
      items = items.filter(a =>
        a.title.toLowerCase().includes(q) ||
        (a.summary && a.summary.toLowerCase().includes(q)) ||
        (a.tags||[]).some(t => t.toLowerCase().includes(q))
      );
    }
    // Sort
    if (sortOrder === 'date-desc') {
      items.sort((a,b) => (b.date||'').localeCompare(a.date||''));
    } else if (sortOrder === 'title') {
      items.sort((a,b) => a.title.localeCompare(b.title, 'zh'));
    }
    return items;
  }

  function getLinkedFile(article) {
    if (!article.content) return '#';
    const m = article.content.match(/href="([^"]+\.html)"/);
    return m ? m[1] : '#';
  }

  function render() {
    const items = getFiltered();
    const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE_DEFAULT));
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * PAGE_SIZE_DEFAULT;
    const page = items.slice(start, start + PAGE_SIZE_DEFAULT);

    document.getElementById('resultInfo').innerHTML =
      activeCat === 'all' && !searchQuery
        ? '共<strong>' + ALL.length + '</strong> 篇免费文章'
        : '找到 <strong>' + items.length + '</strong> 篇相关文章';

    const content = document.getElementById('content');
    if (page.length === 0) {
      content.innerHTML = '<div class="empty-search">没有找到匹配的文章，试试其他关键词或分类</div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    let html = '<div class="article-grid">';
    page.forEach(a => {
      const href = getLinkedFile(a);
      const titleEsc = a.title.replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const descEsc = a.summary ? a.summary.replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
      html += '<a class="art-card" href="' + href + '">';
      html += '<div class="art-cat">' + (getSubjectCat(a) || '综合备考') + '</div>';
      html += '<div class="art-title">' + titleEsc + '</div>';
      if (descEsc) html += '<div class="art-desc">' + descEsc + '</div>';
      if (a.date) html += '<div class="art-date">' + a.date + '</div>';
      html += '</a>';
    });
    html += '</div>';
    content.innerHTML = html;

    // Pagination
    const pg = document.getElementById('pagination');
    if (totalPages <= 1) { pg.innerHTML = ''; return; }

    let pgHtml = '';
    const q = searchQuery.trim();
    const baseUrl = '?cat=' + activeCat + (q ? '&q=' + encodeURIComponent(q) : '') + '&sort=' + sortOrder + '&p=';

    const prevDis = currentPage === 1 ? ' disabled' : '';
    const nextDis = currentPage === totalPages ? ' disabled' : '';
    pgHtml += '<a href="' + baseUrl + (currentPage-1) + '" class="pg-btn' + prevDis + '">← 上一页</a>';
    pgHtml += '<span class="pg-info">' + currentPage + ' / ' + totalPages + '</span>';
    pgHtml += '<a href="' + baseUrl + (currentPage+1) + '" class="pg-btn' + nextDis + '">下一页 →</a>';
    pg.innerHTML = pgHtml;
  }

  // ── Init from URL ──
  const params = new URLSearchParams(location.search);
  activeCat = params.get('cat') || 'all';
  searchQuery = params.get('q') || '';
  sortOrder = params.get('sort') || 'default';
  currentPage = parseInt(params.get('p') || '1');

  if (searchQuery) document.getElementById('searchInput').value = searchQuery;
  if (sortOrder !== 'default') document.getElementById('sortSel').value = sortOrder;

  // Update active sidebar tab
  document.querySelectorAll('.sidebar-cat').forEach(el => {
    el.classList.toggle('active', el.dataset.cat === activeCat);
  });

  // Events
  document.getElementById('searchInput').addEventListener('input', function() {
    searchQuery = this.value;
    currentPage = 1;
    render();
  });
  document.getElementById('sortSel').addEventListener('change', function() {
    sortOrder = this.value;
    currentPage = 1;
    render();
  });

  render();
})();
</script>
</body>
