<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章索引 · 大衍语文店</title>
<meta name="description" content="大衍语文店全部免费阅读文章索引，共964篇，覆盖阅读/作文/古诗词/病句/文言文/名著等中考语文全专题。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f9f9f9;color:#222;line-height:1.6}
.topbar{background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;text-align:center;padding:12px;font-size:14px}
.topbar a{color:#fff;text-decoration:underline}
.container{max-width:960px;margin:0 auto;padding:0 16px}
.page-header{padding:28px 0 20px;text-align:center}
.page-header h1{font-size:1.8em;color:#c0392b;margin-bottom:8px}
.page-header p{color:#888;font-size:0.9em}
.search-row{display:flex;gap:10px;margin-bottom:16px}
.search-input{flex:1;padding:9px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:0.95em;outline:none}
.search-input:focus{border-color:#c0392b}
.cat-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;position:sticky;top:0;background:#f9f9f9;padding:10px 0;z-index:10;border-bottom:1px solid #eee}
.cat-tab{padding:5px 12px;border-radius:20px;font-size:0.8em;cursor:pointer;border:1.5px solid #e0e0e0;background:#fff;color:#555;transition:all .15s}
.cat-tab:hover{border-color:#c0392b;color:#c0392b}
.cat-tab.active{background:#c0392b;color:#fff;border-color:#c0392b}
.cat-block{margin-bottom:28px}
.cat-heading{font-size:1em;color:#c0392b;padding-bottom:6px;margin-bottom:10px;border-bottom:2px solid #f0e0e0;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.cat-count{font-size:0.75em;color:#aaa;font-weight:400}
.article-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.art-card{display:block;background:#fff;border:1px solid #eee;border-radius:8px;padding:12px 14px;text-decoration:none;color:inherit;transition:all .15s}
.art-card:hover{border-color:#c0392b;box-shadow:0 2px 10px rgba(192,57,43,.1);transform:translateY(-1px)}
.art-title{font-size:0.88em;font-weight:600;color:#222;margin-bottom:5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art-desc{font-size:0.76em;color:#999;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.footer{text-align:center;padding:28px;color:#bbb;font-size:0.8em}
.back-link{text-align:center;margin:14px 0}
.back-link a{color:#c0392b;text-decoration:none;font-size:0.9em}
.empty-search{padding:40px;text-align:center;color:#aaa;font-size:0.95em}
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;margin:24px 0;flex-wrap:wrap}
.pg-info{font-size:0.82em;color:#999;margin:0 8px}
.pg-btn{padding:5px 14px;border:1.5px solid #e0e0e0;border-radius:6px;background:#fff;color:#555;font-size:0.85em;cursor:pointer;text-decoration:none;transition:all .15s}
.pg-btn:hover{border-color:#c0392b;color:#c0392b}
.pg-btn.active{background:#c0392b;color:#fff;border-color:#c0392b}
.pg-btn.disabled{opacity:0.4;pointer-events:none}
.page-size-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.page-size-sel{font-size:0.82em;color:#666;padding:5px 10px;border:1.5px solid #e0e0e0;border-radius:6px;background:#fff}
@media(max-width:600px){.article-list{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">📖 大衍语文店免费文章索引 · 共<strong id="totalCount">–</strong>篇 · <a href="index.html">← 返回店铺首页</a></div>
<div class="container">
<div class="page-header"><h1>📚 文章索引</h1><p>免费阅读文章，可直接点击阅读全文</p></div>
<div class="search-row">
  <input class="search-input" id="searchInput" placeholder="搜索文章标题或关键词…" autocomplete="off">
</div>
<div class="page-size-row">
  <div class="cat-tabs" id="catTabs" style="position:static;background:none;border:none;padding:0"></div>
  <select class="page-size-sel" id="pageSizeSel">
    <option value="20">每页20篇</option>
    <option value="50" selected>每页50篇</option>
    <option value="100">每页100篇</option>
  </select>
</div>
<div id="content"></div>
<div class="pagination" id="pagination"></div>
<div class="back-link"><a href="index.html">← 返回大衍语文店首页</a></div>
</div>
<div class="footer">Powered by <strong>大衍神君 AI</strong> · 大衍语文店</div>

<script src="js/data.js"></script>
<script>
(function() {
  const PAGE_SIZE_DEFAULT = 50;
  let activeCat = 'all';
  let searchQuery = '';
  let pageSize = PAGE_SIZE_DEFAULT;
  let currentPage = 1;

  // Collect all a* entries (articles only, not products)
  const ALL = DATA.materials.filter(m => m.id.startsWith('a'));
  const totalEl = document.getElementById('totalCount');
  totalEl.textContent = ALL.length;

  function buildTabs() {
    const cats = ['全部','专项训练','文言文','现代文','综合备考','读书笔记','工具课件','壁纸贴纸'];
    let html = '';
    cats.forEach(c => {
      const catId = c === '全部' ? 'all' : c;
      const count = c === '全部' ? ALL.length : ALL.filter(a => a.category === c).length;
      if (c === '全部' || count > 0) {
        html += '<button class="cat-tab' + (activeCat === catId ? ' active' : '') + '" data-cat="' + catId + '">' + c + ' ' + count + '</button>';
      }
    });
    document.getElementById('catTabs').innerHTML = html;
    document.querySelectorAll('.cat-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeCat = btn.dataset.cat;
        currentPage = 1;
        buildTabs();
        render();
      });
    });
  }

  function getFiltered() {
    let items = ALL;
    if (activeCat !== 'all') items = items.filter(a => a.category === activeCat);
    const q = searchQuery.trim().toLowerCase();
    if (q) items = items.filter(a =>
      a.title.toLowerCase().includes(q) || (a.summary && a.summary.toLowerCase().includes(q))
    );
    return items;
  }

  function render() {
    const items = getFiltered();
    const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * pageSize;
    const page = items.slice(start, start + pageSize);

    const content = document.getElementById('content');
    if (page.length === 0) {
      content.innerHTML = '<div class="empty-search">没有找到匹配的文章，试试其他关键词</div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    // Group by category
    const groups = {};
    page.forEach(a => {
      const cat = a.category;
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(a);
    });

    let html = '';
    const catOrder = ['专项训练','文言文','现代文','综合备考','读书笔记','工具课件','壁纸贴纸'];
    catOrder.forEach(cat => {
      const group = groups[cat];
      if (!group || group.length === 0) return;
      html += '<div class="cat-block">';
      html += '<div class="cat-heading">' + cat + '<span class="cat-count">' + group.length + '篇</span></div>';
      html += '<div class="article-list">';
      group.forEach(a => {
        const titleEsc = a.title.replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const descEsc = a.summary ? a.summary.replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
        // find the linked file
        const fnameMatch = a.content ? a.content.match(/href="([^"]+\.html)"/) : null;
        const fname = fnameMatch ? fnameMatch[1] : '';
        html += '<a class="art-card" href="' + fname + '">';
        html += '<div class="art-title">' + titleEsc + '</div>';
        if (descEsc) html += '<div class="art-desc">' + descEsc + '</div>';
        html += '</a>';
      });
      html += '</div></div>';
    });

    content.innerHTML = html;

    // Pagination
    const pg = document.getElementById('pagination');
    const q = searchQuery.trim();
    const hash = activeCat === 'all' ? '' : '#' + activeCat;

    if (totalPages <= 1) {
      pg.innerHTML = '';
      return;
    }

    let pgHtml = '';
    const prevDisabled = currentPage === 1 ? ' disabled' : '';
    const nextDisabled = currentPage === totalPages ? ' disabled' : '';
    pgHtml += '<a href="?p=' + (currentPage - 1) + '&cat=' + activeCat + (q ? '&q=' + encodeURIComponent(q) : '') + '" class="pg-btn' + prevDisabled + '" onclick="if(this.classList.contains(\'disabled\'))return false">← 上一页</a>';
    pgHtml += '<span class="pg-info">' + currentPage + ' / ' + totalPages + '</span>';
    pgHtml += '<a href="?p=' + (currentPage + 1) + '&cat=' + activeCat + (q ? '&q=' + encodeURIComponent(q) : '') + '" class="pg-btn' + nextDisabled + '" onclick="if(this.classList.contains(\'disabled\'))return false">下一页 →</a>';

    // Page number buttons
    const maxShow = 7;
    let startP = Math.max(1, currentPage - 3);
    let endP = Math.min(totalPages, startP + maxShow - 1);
    if (endP - startP < maxShow - 1) startP = Math.max(1, endP - maxShow + 1);

    if (startP > 1) {
      pgHtml = '<a href="?p=1' + hash + '" class="pg-btn">1</a>' + (startP > 2 ? '<span class="pg-info">…</span>' : '') + pgHtml;
    }
    // Insert page number buttons before next arrow
    const nextBtn = pgHtml.lastIndexOf('>下一页');
    const prefix = pgHtml.substring(0, nextBtn);
    const suffix = pgHtml.substring(nextBtn);
    let numBtns = '';
    for (let p = startP; p <= endP; p++) {
      if (p !== currentPage) numBtns += '<a href="?p=' + p + '&cat=' + activeCat + (q ? '&q=' + encodeURIComponent(q) : '') + '" class="pg-btn">' + p + '</a>';
      else numBtns += '<span class="pg-btn active">' + p + '</span>';
    }
    pg.innerHTML = prefix + numBtns + suffix;
  }

  // Init from URL params
  const params = new URLSearchParams(location.search);
  const urlPage = parseInt(params.get('p'));
  const urlCat = params.get('cat');
  const urlQ = params.get('q');
  if (urlPage > 1) currentPage = urlPage;
  if (urlCat && ['all','专项训练','文言文','现代文','综合备考','读书笔记','工具课件','壁纸贴纸'].includes(urlCat)) activeCat = urlCat;
  if (urlQ) {
    searchQuery = decodeURIComponent(urlQ);
    document.getElementById('searchInput').value = searchQuery;
  }

  const pageSizeSel = document.getElementById('pageSizeSel');
  pageSizeSel.value = String(pageSize);
  pageSizeSel.addEventListener('change', () => {
    pageSize = parseInt(pageSizeSel.value);
    currentPage = 1;
    render();
    window.scrollTo(0, 0);
  });

  buildTabs();
  render();

  document.getElementById('searchInput').addEventListener('input', function() {
    searchQuery = this.value;
    currentPage = 1;
    render();
  });
})();
</script>
</body>
</html>
