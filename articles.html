let activeCat = 'all';
let searchQuery = '';

function renderTabs() {
  let total = Object.values(ARTICLES).flat().length;
  let html = '<button class="cat-tab' + (activeCat === 'all' ? ' active' : '') + '" data-cat="all">全部 ' + total + '</button>';
  CAT_ORDER.forEach(cat => {
    if (!ARTICLES[cat]) return;
    const count = ARTICLES[cat].length;
    html += '<button class="cat-tab' + (activeCat === cat ? ' active' : '') + '" data-cat="' + cat + '">' + cat + ' ' + count + '</button>';
  });
  document.getElementById('catTabs').innerHTML = html;
  document.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCat = btn.dataset.cat;
      document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderContent();
    });
  });
}

function renderContent() {
  const content = document.getElementById('content');
  let cats = activeCat === 'all' ? CAT_ORDER.filter(c => ARTICLES[c]) : [activeCat];
  const q = searchQuery.trim().toLowerCase();

  if (q) {
    cats = CAT_ORDER.filter(c => ARTICLES[c] && ARTICLES[c].some(a =>
      a.title.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q)
    ));
  }

  if (cats.length === 0 || (q && cats.length === 0)) {
    content.innerHTML = '<div class="empty-search">没有找到匹配的文章，换个关键词试试</div>';
    return;
  }

  let html = '';
  cats.forEach(cat => {
    const items = q ? ARTICLES[cat].filter(a => a.title.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q)) : ARTICLES[cat];
    if (items.length === 0) return;
    html += '<div class="cat-block">';
    html += '<div class="cat-heading">' + cat + '<span class="cat-count">' + items.length + '篇</span></div>';
    html += '<div class="article-list">';
    items.forEach(a => {
      html += '<a class="art-card" href="' + a.file + '">';
      html += '<div class="art-title">' + a.title + '</div>';
      if (a.desc) html += '<div class="art-desc">' + a.desc + '</div>';
      html += '</a>';
    });
    html += '</div></div>';
  });
  content.innerHTML = html;
}

renderTabs();
renderContent();
document.getElementById('searchInput').addEventListener('input', function() {
  searchQuery = this.value;
