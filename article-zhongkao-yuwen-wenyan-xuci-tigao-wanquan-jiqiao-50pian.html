<h2>一，文言虚词提高完全技巧手册</h2>
<h2>提高技巧</h2>
<p>1. 之——助词/代词/取消句子独立性</p>
<p>2. 其——代词/语气词/连词</p>
<p>3. 以——介词/连词/动词</p>
<p>4. 于——介词/在/比/向/从</p>
<p>5. 而——连词/转折/顺承/修饰</p>
<p>6. 乃——副词/才/就/竟然</p>
<p>7. 若——代词/像/如果</p>
<p>8. 焉——代词/兼词/语气词</p>
