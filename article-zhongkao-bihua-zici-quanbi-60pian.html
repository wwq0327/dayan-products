<h1 class="h1">中考语文笔画写词全攻略60篇</h1>
<h2>常见笔画错误</h2>
<p>1. 万：撇不能弯，要先横再撇</p>
<p>2. 及：撇要越过竖钩</p>
<p>3. 母：注意不是田字头</p>
<p>4. 肺：右边不是"市"</p>

<h2>笔画顺序规则</h2>
<p>先横后竖｜先撇后捺｜从上到下｜从左到右</p>
<p>先外后内｜先中间后两边｜先进入后关门</p>

<h2>易错字笔画</h2>
<p>火：点→短撇→长撇→撇→反捺（四点底不同写法）</p>
<p>比：横→竖提→撇→竖弯钩</p>
<p>比：注意不要写成"W"</p>
