<h1 class="h1">中考语文标点符号完全方法50篇</h1>
<h2>一，标点符号完全方法手册</h2>
<h2>标点方法</h2>
<p>1. 句号——陈述句结尾</p>
<p>2. 问号——疑问句/反问句结尾</p>
<p>3. 感叹号——强烈情感句结尾</p>
<p>4. 逗号——分句之间/状语后</p>
<p>5. 顿号——并列词语之间</p>
<p>6. 分号——并列分句之间</p>
<p>7. 冒号——提示语后/总结上文</p>
<p>8. 引号——引用/特定称谓/讽刺</p>
