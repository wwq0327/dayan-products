<h1 class="h1">中考语文议论文论证方法辨别与练习</h1>
<h2>四大论证方法</h2>
<p><strong>举例论证：</strong>举出具体事例证明论点</p>
<p><strong>道理论证：</strong>引用名言警句、科学原理证明</p>
<p><strong>对比论证：</strong>将正反两方面对比</p>
<p><strong>比喻论证：</strong>用比喻说明道理</p>

<h2>辨别技巧</h2>
<p>看有没有"如……""例如……"→举例论证<br>
看有没有"正如……所说""古语云"→道理论证<br>
看有没有"但是……""然而……"→对比论证<br>
看有没有"像……""如同……"→比喻论证</p>

<h2>练习题</h2>
<p>以下各句使用了哪种论证方法？</p>
<p>1. "自古以来，无数仁人志士的事迹告诉我们……"（　　）</p>
<p>2. "没有付出就没有收获，就像农民不种地就没有粮食一样。"（　　）</p>
