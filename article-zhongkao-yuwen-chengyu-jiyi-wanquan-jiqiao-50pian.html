<h2>记忆技巧</h2>
<p>1. 望文生义——不了解含义就使用</p>
<p>2. 褒贬误用——感情色彩错误</p>
<p>3. 对象不当——适用对象不匹配</p>
<p>4. 语境不合——与语境不协调</p>
<p>5. 语义重复——与句中词语重复</p>
<p>6. 语义矛盾——与句意矛盾</p>
<p>7. 语义程度——过轻或过重</p>
<p>8. 语义范围——过大或过小</p>
