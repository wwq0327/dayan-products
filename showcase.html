<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>大衍语文店 · 产品预览</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'PingFang SC', sans-serif; background: #f5f5f5; padding: 40px 20px; }
.page-title { text-align: center; margin-bottom: 40px; }
.page-title h1 { font-size: 28px; color: #c0392b; margin-bottom: 8px; }
.page-title p { color: #888; font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; }
.card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.card-img { width: 100%; display: block; }
.card-body { padding: 16px 20px; }
.card-name { font-size: 16px; font-weight: 600; color: #111; margin-bottom: 4px; }
.card-meta { display: flex; align-items: center; justify-content: space-between; }
.card-price { font-size: 18px; font-weight: 700; color: #c0392b; }
.card-cat { font-size: 12px; color: #888; }
.back-link { text-align: center; margin-top: 32px; }
.back-link a { color: #c0392b; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
<div class="page-title">
  <h1>大衍语文店 · 产品一览</h1>
  <p>点击查看详情，邮件下单自动发货</p>
</div>
<div class="grid">

    <img src="_previews/病句修改-预览.png" class="card-img" alt="病句修改选择题">

      </div>
    </div>
  </div>
  <div class="card">
    <img src="_previews/虚词专题-预览.png" class="card-img" alt="文言虚词复习专题">
    <div class="card-body">
      <div class="card-name">中考文言虚词复习专题（之以其而于乃）</div>
      <div class="card-meta">
        <span class="card-price">¥19.9</span>
        <span class="card-cat">文言文</span>
      </div>
    </div>
  </div>
  <div class="card">
    <img src="_previews/字音游戏-预览.png" class="card-img" alt="字音字形答题游戏">
    <div class="card-body">
      <div class="card-name">语文字音字形答题游戏（HTML互动）</div>
      <div class="card-meta">
        <span class="card-price">¥4.9</span>
        <span class="card-cat">互动课件</span>
      </div>
    </div>
  </div>
  <div class="card">
    <img src="_previews/43天复习计划-预览.png" class="card-img" alt="43天复习计划">
    <div class="card-body">
      <div class="card-name">43天中考语文复习计划</div>
      <div class="card-meta">
        <span class="card-price">¥19.9</span>
        <span class="card-cat">综合备考</span>
      </div>
    </div>
  </div>
</div>
<div class="back-link">
  <a href="https://wwq0327.github.io/dayan-products/">← 返回店铺</a>
</div>

</html>
