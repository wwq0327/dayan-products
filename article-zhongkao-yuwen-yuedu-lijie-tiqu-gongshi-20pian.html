<h1 class="h1">中考语文阅读理解提取公式20篇</h1>
<h2>一、提取公式汇总</h2>
<div class="moban">
<h3>标题含义公式</h3>
表层含义……+深层含义……（象征/情感/主旨）
</div>

<div class="moban">
<h3>段意提取公式</h3>
①……②……③……（逐层归纳）
</div>

<div class="moban">
<h3>主旨提取公式</h3>
本文通过记叙……（事件），表现了……（情感/道理）
</div>

<h2>二、真题示例</h2>
<p><strong>例题：</strong>"概括第三段的段意"</p>
<div class="moban">"第三段写了……（内容），表达了……（情感/观点）。"</div>

<h2>三、练习建议</h2>
<p>每天练习3道提取题，对照答案，总结规律。</p>
<p>注意语言简洁、要点完整。</p>
