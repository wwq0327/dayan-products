<h1 class="h1">中考语文活物温故技巧大演算法（含高效记忆法）</h1>
<h2>什么是"活物温故"</h2>
<p>活物温故 = 主动回忆+间隔重复+多角度复习</p>

<h2>记忆曲线复习计划</h2>
<p><strong>第1天：</strong>学习新内容</p>
<p><strong>第3天：</strong>第一次复习</p>
<p><strong>第7天：</strong>第二次复习</p>
<p><strong>第15天：</strong>第三次复习</p>
<p><strong>第30天：</strong>第四次复习</p>

<h2>具体操作</h2>
<p><strong>语文：</strong>每天背3个成语+2句古诗+1篇古文</p>
<p><strong>阅读：</strong>每两天做1篇阅读理解，对答案</p>
<p><strong>作文：</strong>每周背1个开头结尾模板</p>
