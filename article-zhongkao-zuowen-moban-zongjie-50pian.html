<h1 class="h1">中考语文作文模板总结50篇（含各种题型）</h1>
<h2>一、写人模板</h2>
<p>开头：点明人物身份+特点<br>
中间：通过具体事件展现人物性格（2-3件事）<br>
结尾：总结人物给我的启示/感动</p>

<h2>二、记事模板</h2>
<p>开头：交代时间、地点、人物<br>
中间：按顺序写清起因、经过、结果<br>
结尾：写出自己的感悟或收获</p>

<h2>三、写景模板</h2>
<p>开头：总写景物特点<br>
中间：按方位/时间/游览顺序分写<br>
结尾：抒发情感</p>

<h2>四、议论文模板</h2>
<p>开头：提出论点<br>
中间：举例论证+道理论证<br>
结尾：总结升华</p>

<h2>五、感悟类模板</h2>
<p>叙述事件→产生感悟→联系生活→总结升华</p>
