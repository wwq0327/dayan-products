<h1 class="h1">中考语文名著阅读考点精讲（含名著真题）</h1>
<h2>骆驼祥子考点精讲</h2>
<p><strong>老舍</strong>，原名舒庆春，字舍予</p>
<p><strong>主要情节：</strong>祥子买车三起三落、虎妞难产、小福子上吊</p>
<p><strong>人物形象：</strong>祥子（积极向上→自甘堕落）</p>
<p><strong>主题：</strong>旧社会底层车夫的悲惨命运</p>

<h2>西游记考点精讲</h2>
<p><strong>吴承恩</strong>，明代</p>
<p><strong>主要情节：</strong>大闹天宫→三打白骨精→三借芭蕉扇→取得真经</p>
<p><strong>人物形象：</strong>孙悟空（勇敢机智）、唐僧（善良固执）</p>

<h2>朝花夕拾考点精讲</h2>
<p><strong>鲁迅</strong>，原名周树人</p>
<p><strong>重要篇目：</strong>从百草园到三味书屋、藤野先生、阿长与山海经</p>

<h2>海底两万里考点精讲</h2>
<p><strong>儒勒·凡尔纳</strong>（法国科幻小说之父）</p>
<p><strong>主要情节：</strong>鹦鹉螺号潜艇的奇幻之旅</p>
