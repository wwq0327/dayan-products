<h2>1. 中考语文时间如何分配？</h2>
<p>建议：基础题30分钟，阅读题40分钟，作文50分钟，留10分钟检查。</p>

<h2>2. 作文跑题了怎么抢救？</h2>
<p>在结尾段落强行扣题，用2-3句议论把主题拉回正轨。</p>

<h2>3. 不会答的题目怎么处理？</h2>
<p>① 先做记号跳过②返回时结合全文找线索③用公式套</p>

<h2>4. 说明文和议论文怎么区分？</h2>
<p>说明文客观介绍事物特征；议论文有明确论点支撑。</p>

<h2>5. 文言文翻译采分点在哪？</h2>
<p>①关键词②通假字/古今异义③词类活用④特殊句式</p>
