<h1 class="h1">中考语文作文模板与预测30篇</h1>
<h2>一、命题预测</h2>
<p><strong>成长类：</strong>《那一刻，我长大了》《我不后悔》</p>
<p><strong>情感类：</strong>《触动心灵的声音》《温暖》</p>
<p><strong>品质类：</strong>《致敬英雄》《做一个________的人》</p>
<p><strong>思考类：</strong>《这就是我的答案》《越过那道坎》</p>

<h2>二、开头模板</h2>
<p><strong>模板1：</strong>引用式——"正如那句话所说……"</p>
<p><strong>模板2：</strong>写景式——"那天……，……涌上心头"</p>
<p><strong>模板3：</strong>对话式——"你怎么还不睡？"我轻声问道"</p>

<h2>三、结尾模板</h2>
<p><strong>模板1：</strong>首尾呼应——"那一刻，我终于明白……"</p>
<p><strong>模板2：</strong>哲理升华——"这将成为我一生的财富"</p>
<p><strong>模板3：</strong>情感回荡——"从此以后，每当我……"</p>
