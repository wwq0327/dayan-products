<h1 class="h1">中考语文提高成绩技巧全集（含各题型）</h1>
<h2>一、基础部分满分策略</h2>
<p><strong>字音字形：</strong>每天10个易错字，反复听写</p>
<p><strong>病句修改：</strong>六种类型公式，背到熟练</p>
<p><strong>标点符号：</strong>专项50题，做完后总结规律</p>
<p><strong>词语成语：</strong>先理解后记忆，避免死记硬背</p>

<h2>二、阅读理解满分策略</h2>
<p><strong>公式法：</strong>每种题型都有万能公式</p>
<p><strong>真题法：</strong>做近5年真题，总结命题规律</p>
<p><strong>错题法：</strong>整理错题本，定期复习</p>

<h2>三、作文满分策略</h2>
<p><strong>开头公式：</strong>景物/悬念/引用/对话任选</p>
<p><strong>结构公式：</strong>六段式最稳当</p>
<p><strong>结尾公式：</strong>首尾呼应+哲理升华</p>

<h2>四、考场时间管理</h2>
<p>基础30分+阅读40分+作文50分+检查20分</p>
