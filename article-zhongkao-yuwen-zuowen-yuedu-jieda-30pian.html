<h1 class="h1">中考语文作文阅读解答30篇</h1>
<h2>一、审题技巧</h2>
<p><strong>半命题：</strong>先补充题目，再写</p>
<p><strong>话题作文：</strong>抓话题关键词，找切入角度</p>
<p><strong>材料作文：</strong>提炼材料核心，确立立意</p>

<h2>二、立意技巧</h2>
<p>从小事上升到人生哲理</p>
<p>从个人情感上升到社会思考</p>
<p>从事件本身上升到精神品质</p>

<h2>三、结构技巧</h2>
<p>六段式——开头+铺垫+事件1+事件2+感悟+结尾</p>
<p>排比段落——用3-4个并列段落</p>
<p>起承转合——标准的议论结构</p>

<h2>四、开头结尾技巧</h2>
<p>开头：景物/悬念/引用/对话</p>
<p>结尾：首尾呼应+哲理升华</p>
