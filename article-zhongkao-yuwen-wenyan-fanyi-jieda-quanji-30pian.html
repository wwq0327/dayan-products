<h1 class="h1">中考语文文言文翻译解答全集30篇</h1>
<h2>一、文言文翻译原则</h2>
<p><strong>信：</strong>忠实原文，字字落实</p>
<p><strong>达：</strong>表意明确，语言通顺</p>
<p><strong>雅：</strong>用词优美，符合语境</p>

<h2>二、翻译技巧</h2>
<p><strong>留：</strong>人名、地名、官职名保留</p>
<p><strong>换：</strong>古今异义词换成今义</p>
<p><strong>增：</strong>省略成分补充</p>
<p><strong>删：</strong>无义助词删除</p>
<p><strong>调：</strong>倒装句调整语序</p>

<h2>三、常见古今异义</h2>
<p><strong>穷：</strong>古义走投无路→今义贫困</p>
<p><strong>走：</strong>古义跑→今义行走</p>
<p><strong>汤：</strong>古义热水→今义汤汁</p>
<p><strong>购：</strong>古义悬赏→今义购买</p>
<p><strong>怜：</strong>古义可怜/爱→今义可怜</p>

<h2>四、重点句子翻译</h2>
<p><strong>例句1：</strong>"君将哀而生之乎"</p>
<div class="moban">"您大概会可怜我，让我活下去吧。"</div>
