<h2>四种语言升格技巧</h2>
<ul>
<li><strong>修辞增色</strong>：比喻、拟人、排比、夸张让文字更有感染力</li>
<li><strong>动词精准</strong>：用具体准确的动词替代模糊动词</li>
<li><strong>长短句结合</strong>：短句有力，长句舒缓，节奏感强</li>
<li><strong>四字词语</strong>：适当使用四字词语，文言味更浓</li>
</ul>
<h2>备考建议</h2>
<p>每篇作文练习使用至少2种语言升格技巧，形成个人语言风格。</p>
