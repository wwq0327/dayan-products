<h2>一、课外阅读命题规律</h2>
<p>课外阅读多考记叙文、散文、说明文、议论文四种文体。</p>

<h2>二、课外记叙文答题公式</h2>
<div class="moban">"这篇短文通过叙述……（事件），表现了……（人物精神/主题），表达了作者……之情。"</div>

<h2>三、课外说明文答题公式</h2>
<div class="moban">"这篇文章运用了……（说明方法），说明了……（对象特征），语言准确/生动。"</div>

<h2>四、课外议论文答题公式</h2>
<div class="moban">"本文的中心论点是……，运用了……（论证方法）加以论证，具有说服力。"</div>
