<h1 class="h1">中考语文理解默写满分解答（含易错字）</h1>
<h2>理解默写核心篇目</h2>
<p><strong>《论语》十二则：</strong>学习方法、为人处世</p>
<p><strong>《出师表》</strong>：忧国忧民、忠心耿耿</p>
<p><strong>《鱼我所欲也》</strong>：舍生取义</p>
<p><strong>《爱莲说》</strong>：托物言志、出淤泥不染</p>
<p><strong>《天净沙·秋思》</strong>：思乡名曲</p>

<h2>常见默写考题</h2>
<p><strong>考题1：</strong>"________________，浅草才能没马蹄。"（乱花渐欲迷人眼）</p>
<p><strong>考题2：</strong>"________________，高处不胜寒。"（我欲乘风归去）</p>

<h2>易错字汇总</h2>
<p>"春风又绿江南岸"——绿，不是"绿"</p>
<p>"山重水复疑无路"——疑，不是"凝"</p>
