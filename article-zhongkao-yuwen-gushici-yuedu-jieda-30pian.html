<h1 class="h1">中考语文古诗词阅读解答30篇</h1>
<h2>一、古诗词鉴赏步骤</h2>
<p><strong>Step 1：</strong>读标题——抓时令/地点/情感</p>
<p><strong>Step 2：</strong>读诗句——理解字面意思</p>
<p><strong>Step 3：</strong>抓意象——判断核心意象</p>
<p><strong>Step 4：</strong>悟情感——送别/思乡/爱国/隐逸</p>
<p><strong>Step 5：</strong>析手法——借景抒情/托物言志</p>

<h2>二、情感类型判断</h2>
<p>送别诗：依依不舍+美好祝愿</p>
<p>思乡诗：漂泊之苦+归家之念</p>
<p>边塞诗：征戍之苦+报国之志</p>
<p>山水诗：隐逸之趣+自然之美</p>
<p>咏史诗：凭古讽今+壮志难酬</p>

<h2>三、满分公式</h2>
<div class="moban">"这首诗写了……（意象），用了……手法，表达了诗人……情感。"</div>
