<h1 class="h1">中考语文病句类型辨别50题</h1>
<h2>病句六大类型</h2>
<p><strong>1. 语序不当：</strong>多项定语/状语顺序颠倒</p>
<p><strong>2. 搭配不当：</strong>主谓/动宾/关联词不搭配</p>
<p><strong>3. 成分残缺：</strong>缺主语/谓语/宾语</p>
<p><strong>4. 成分赘余：</strong>语义重复/多余成分</p>
<p><strong>5. 结构混乱：</strong>两个句子混杂</p>
<p><strong>6. 不合逻辑：</strong>前后矛盾/一面两面对应</p>

<h2>辨析技巧</h2>
<p>第一步：压缩句子，检查主谓宾是否齐全</p>
<p>第二步：检查动宾搭配是否恰当</p>
<p>第三步：检查定状语位置</p>
<p>第四步：检验逻辑关系是否合理</p>

<h2>练习题</h2>
<p><strong>1.</strong> "同学们要养成上课认真听讲。"——缺少什么成分？</p>
<p>答案：缺少宾语，应改为"认真听讲的习惯"（成分残缺）</p>
