<h2>七字翻译法</h2>
<ul>
<li><strong>留</strong>：人名、地名、官职名保留不译</li>
<li><strong>换</strong>：单字词换成现代词</li>
<li><strong>增</strong>：省略成分补充完整</li>
<li><strong>删</strong>：无意义虚词删除</li>
<li><strong>调</strong>：主谓倒装语序调整</li>
<li><strong>选</strong>：一词多义选择正确义项</li>
<li><strong>固</strong>：古今同形词组固守原意</li>
</ul>
<h2>备考建议</h2>
<p>每天练习5句课内重点句子翻译，用七字法检查。</p>
